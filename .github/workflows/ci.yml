name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so a change in a pinned wheel's platform support or in the PVGIS
  # response format shows up without a push.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e backend

      - name: Lint
        run: ruff check backend scripts tests

      - name: Format check
        run: ruff format --check backend scripts tests

      - name: Unit tests
        run: pytest tests/unit -p no:warnings

      # The numbers printed in the README against the artefacts that produced them.
      - name: Artefact tests
        run: pytest tests/integrity -p no:warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Layout in a browser
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run check:layout
