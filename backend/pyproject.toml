[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suncokret"
version = "0.1.0"
description = "Rooftop solar yield for Zagreb from ZG3D roof planes, PVGIS irradiance and inter-building shadow casting"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Only for assembling the README walkthrough from captured frames.
    "pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["suncokret*"]
